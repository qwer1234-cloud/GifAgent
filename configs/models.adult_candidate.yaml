# Adult-candidate adaptive overrides (v3: tighter near-dupe control).
# This file only overrides the `adaptive:` block; `vlm:` here is
# documentation of the recommended value for this preset (nothing merges
# it into a running config today -- see app/config.py).
vlm:
  # 16GB VRAM has headroom for the VLM + nomic-embed-text simultaneously,
  # so skip the unload-before-load step (Task 7: model lifecycle repair).
  free_vram_before_load: false

adaptive:
  sample_interval: 7
  merge_gap: 15
  merge_score_threshold: 0.50
  max_merge_span_s: 24
  merge_peak_threshold: 0.55
  worthiness_threshold: 0.42
  refine_threshold: 0.55
  refine_radius: 15
  refine_interval: 5
  min_duration: 2
  max_duration: 8
  # One scored frame is thin evidence, so isolated singles stay shorter
  # than merged runs even at worthiness 1.0.
  single_frame_max_duration_s: 5
  action_guard_enabled: true
  action_vlm_verify_enabled: true
  action_analysis_version: 1
  action_analysis_window_s: 30
  action_preferred_min_duration_s: 4
  action_preferred_max_duration_s: 8
  action_scan_fps: 4
  action_boundary_confidence_threshold: 0.65
  action_loop_adjust_s: 0.75
  action_vlm_min_worthiness: 0.60
  action_fallback_mode: fixed_window
  min_brightness: 10
  output_ratio: 0.45
  max_output: 35
  # Greedy, seeded decoding. Every downstream threshold (worthiness,
  # refine, merge) is built on these scores, so re-running a video must
  # reproduce them exactly or A/B comparisons are meaningless.
  vlm_temperature: 0.0
  vlm_top_p: 1.0
  vlm_top_k: 1
  vlm_seed: 20260823
  # Keep the VLM resident between stage subprocesses instead of letting it
  # fall back to Ollama's own default eviction timeout (Task 7).
  vlm_keep_alive: "30m"
  # GIF stores frame delays in centiseconds, so gif_fps must divide 100 or
  # playback is unevenly rounded. 24 -> 25 removes that stutter.
  gif_fps: 25
  gif_max_width: 720
  # diff-mode palettes spend their 256 colors on the moving region, and
  # rectangle diff only rewrites the changed area, which shrinks the file.
  gif_palette_stats_mode: diff
  gif_dither: sierra2_4a
  gif_diff_mode: rectangle
  clear_output_dir: true
  potplayer_pbf_enabled: true
  embedding_dedup_enabled: true
  embedding_dedup_threshold: 0.88
  temporal_dedup_enabled: true
  temporal_dedup_min_gap_s: 15
  transition_guard_enabled: true
  transition_min_duration_s: 2.0
  transition_boundary_margin_s: 0.25
  transition_scan_fps: 8
  transition_scan_width: 320
  transition_motion_compensation: true
  transition_hard_threshold: 0.65
  transition_soft_threshold: 0.40
  transition_soft_run_frames: 3
  transition_rescore_split_segments: true
  score_prompt_mode: adult
  # Coarse/refine extraction is pure I/O + CPU decode; 16GB VRAM setups can
  # run several ffmpeg processes alongside GPU scoring without contention.
  frame_extract_workers: 6
