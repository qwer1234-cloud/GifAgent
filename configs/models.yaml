media:
  source_dir: "E:/data/originals"
  image_max_side: 1344
  gif_sample_frames: 8
  gif_max_sample_frames: 12
  video_sample_fps: 1

vlm:
  provider: "ollama"
  model: "llava:13b"
  # Resolved once through the lifecycle-aware Ollama runtime when a job starts.
  base_url: "auto"
  batch_size: 50
  max_batch_size: 100
  # Task 4 (seventh-review): explicit lifecycle config.  URL never
  # decides the launch mode; manage_lifecycle and launch_mode must be
  # explicitly set.  launch_mode: none (no lifecycle), native (ollama),
  # wsl (wsl ollama).
  manage_lifecycle: true
  launch_mode: "wsl"

llm:
  provider: "openai_compatible"
  model: "deepseek-v4-flash"
  api_key_env: "DEEPSEEK_API_KEY"
  base_url: "https://api.deepseek.com/v1"
  require_json: true
  temperature: 0.3
  max_tokens: 2048
  timeout_s: 120
  anthropic_version: "2023-06-01"

embedding:
  provider: "ollama"
  image_model: "llava:13b"
  text_model: "nomic-embed-text:latest"
  # Portable runtime: "auto" resolves the live WSL address at call time.
  # Set GIFAGENT_OLLAMA_BASE to pin a deterministic/remote endpoint.
  base_url: "auto"
  manage_lifecycle: true
  launch_mode: "wsl"
  wsl_distro: "Ubuntu-20.04"
  startup_timeout_s: 120
  request_timeout_s: 60
  retry_attempts: 3
  retry_backoff_s: 2
  keep_alive: "30m"

scheduler:
  model_switch_wait: 10
  max_retries: 3

scoring:
  visual_similarity_weight: 0.50
  text_similarity_weight: 0.25
  emotional_match_weight: 0.15
  cluster_confidence_weight: 0.10
  high_match_threshold: 0.80
  review_threshold: 0.60

dedup:
  phash_hamming_threshold: 5

preference_memory:
  enabled: false
  base_score_weight: 0.50
  preference_score_weight: 0.50

  # Profile build parameters (see ProfileBuildConfig in preference_types.py)
  recency_enabled: true
  # Half-life for recency decay: age_days / half_life -> weight = 0.5^(age/half)
  recency_half_life_days: 90.0
  # Rating weights used during centroid computation
  favorite_weight: 2.0    # favorite = 2x influence of a standard "like"
  like_weight: 1.0        # baseline positive signal
  dislike_weight: 1.0     # baseline negative signal
  # Minimum feedback events within a scenario key to build a scenario profile
  scenario_min_feedback: 8

quality_moe:
  enabled: true
  # Until calibrated against human review, quality evidence is append-only and
  # does not change candidate count or export order.
  report_only: true
  evaluation_version: quality-moe-v1
  soft_reject:
    min_judge_confidence: 0.80
    min_independent_negative_families: 2
  experts:
    technical_aesthetic:
      enabled: true
      version: builtin-v1
    cinematic:
      enabled: true
      version: builtin-v1
    temporal:
      enabled: true
      version: builtin-v1
  judge:
    model_id: llava:13b
    temperature: 0
    timeout_seconds: 120
    base_url: inherit_vlm
    schema_version: quality-judge-v1
  repairability:
    enabled: true
    max_proxy_variants: 12
    min_quality_gain: 0.15
    min_confidence: 0.80
    photometric_mode: clip_global
    geometric_mode: fixed_or_validated_smooth

adaptive:
  # Balanced quality-first preset (2026-08-11): keep dense discovery, then
  # demand stronger evidence. Output count is not itself minimized; qualified,
  # deduplicated candidates retain a generous ratio and cap.
  # Baseline values preserved in data/backups/before_adult_opt_* .
  sample_interval: 7
  merge_gap: 15
  merge_score_threshold: 0.58
  # Prevent dense high-score runs from collapsing into one mega-clip.
  max_merge_span_s: 18
  # Multi-frame groups must contain a peak at/above this (else demote to single).
  merge_peak_threshold: 0.65
  worthiness_threshold: 0.55
  refine_threshold: 0.65
  refine_radius: 12
  refine_interval: 5
  min_duration: 2
  max_duration: 20
  action_guard_enabled: true
  action_vlm_verify_enabled: true
  action_analysis_version: 1
  action_analysis_window_s: 30
  action_preferred_min_duration_s: 4
  action_preferred_max_duration_s: 12
  action_scan_fps: 4
  action_boundary_confidence_threshold: 0.65
  action_loop_adjust_s: 0.75
  action_vlm_min_worthiness: 0.60
  action_fallback_mode: fixed_window
  # Dark-frame prefilter (grayscale mean). 0 = disable. Legacy default was 25.
  min_brightness: 10
  # v3: cut near-duplicate / near-time clips after denser adult scoring.
  output_ratio: 0.75
  max_output: 50
  vlm_temperature: 0.25
  vlm_top_p: 0.90
  vlm_top_k: 40
  gif_fps: 24
  gif_max_width: 720
  clear_output_dir: true
  potplayer_pbf_enabled: true
  embedding_dedup_enabled: true
  embedding_dedup_threshold: 0.88
  temporal_dedup_enabled: true
  temporal_dedup_min_gap_s: 15
  transition_guard_enabled: true
  transition_min_duration_s: 2.0
  transition_boundary_margin_s: 0.25
  transition_scan_fps: 8
  transition_scan_width: 320
  transition_motion_compensation: true
  transition_hard_threshold: 0.65
  transition_soft_threshold: 0.40
  transition_soft_run_frames: 3
  transition_rescore_split_segments: true
  # Scoring prompt: set GIFAGENT_SCORE_PROMPT_MODE=adult (AB runner does this).
  # Or leave unset to use cinematic default SCORE_PROMPT.

# Previous baseline adaptive (pre-adult A/B):
#   sample_interval: 10, merge_score_threshold: 0.50, worthiness_threshold: 0.50,
#   refine_threshold: 0.65, refine_radius: 10, refine_interval: 10,
#   min_brightness: 25, output_ratio: 0.45, max_output: 40,
#   embedding_dedup_threshold: 0.90, temporal_dedup_min_gap_s: 12
#
# v2 (high recall, too many near-dupes):
#   output_ratio: 0.70, max_output: 80,
#   embedding_dedup_threshold: 0.95, temporal_dedup_min_gap_s: 8

task_engine:
  enabled: true
  db_path: "data/task_state.db"
  poll_seconds: 1.0
  lease_seconds: 90
  max_attempts: 3
  base_delay_seconds: 5
  max_delay_seconds: 300

database:
  path: "data/library.db"

paths:
  frames_dir: "data/frames"
  thumbs_dir: "data/thumbs"
  faiss_dir: "data/faiss"
  exports_dir: "data/exports"
