[project]
name = "gifagent"
version = "0.1.0"
description = "Local movie-scene GIF auto-tagging and preference agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "gradio>=5.0",
    "Pillow>=11.0",
    "imagehash>=4.3",
    "numpy>=2.0",
    "faiss-cpu>=1.9",
    "watchdog>=6.0",
    "httpx>=0.28",
    "pydantic>=2.10",
    "python-multipart>=0.0.18",
    "opencv-python-headless>=4.10",
    "pyyaml>=6.0",
    "pywebview>=5.0",
]

[dependency-groups]
dev = [
    "cosmic-ray>=8.7.0",
    "hypothesis>=6.165.10",
    "mypy>=2.3.1",
    "pytest>=8.0",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["scripts", "dist", ".venv", "data"]
markers = [
    "slow: mark test as slow (production E2E, ffmpeg/subprocess). Use -m slow to include; production gate must run --no-header.",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
  "app/quality_lab",
  "app/task_engine",
  "app/services",
]
exclude = [
  '^app/services/preference_',
  '^app/services/candidate_vectors[.]py$',
  '^app/services/reranker[.]py$',
  '^app/services/embedding[.]py$',
  '^app/services/library_search[.]py$',
  '^app/services/workbench_schema[.]py$',
  '^app/task_engine/artifacts',
]
